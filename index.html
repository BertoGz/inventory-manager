<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Manager</title>

    <!-- Theme tokens: light/dark custom palette -->
    <style>
      :root {
        /* Default to dark theme tokens */
        --app-bg: #1c2653; /* app background */
        --sidebar-bg: #2e468e; /* left sidebar background */
        --panel-bg: #020617; /* main panel background (if needed) */
        --border-color:#343e5d; /* borders / separators */
        --text-main: #e5e7eb; /* primary text */
        --text-muted: #9ca3af; /* secondary text */
      }

      /* Explicit light theme – add class="light" on <html> to force */
      .light {
        --app-bg: #f9fafb;
        --sidebar-bg: #ffffff;
        --panel-bg: #ffffff;
        --border-color: #e5e7eb;
        --text-main: #0f172a;
        --text-muted: #6b7280;
      }

      /* Explicit dark theme – add class="dark" on <html> to force */
      .dark {
        --app-bg: #020617;
        --sidebar-bg: #020617;
        --panel-bg: #020617;
        --border-color: #1f2937;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
      }
    </style>

    <!-- Google Analytics 4 is loaded from the app when VITE_GA_MEASUREMENT_ID is set in .env -->

    <!-- xlsx / ExcelJS / jsPDF: loaded on demand from the app. sql.js is lazy-loaded via Vite
         (src/Helpers/sqlJs.js + bundled wasm) when backup / .db restore runs — no global script tag. -->

    <!-- Transformers.js loads on demand (first search / embedding job) via dynamic import. -->
    <script type="module" crossorigin src="/inventory-manager/assets/index-XGrEFmGF.js"></script>
    <link rel="modulepreload" crossorigin href="/inventory-manager/assets/vendor-modules-BL1yPz22.js">
    <link rel="stylesheet" crossorigin href="/inventory-manager/assets/style-D3IqIOq_.css">
  </head>
  <body class="overflow-hidden" style="background: var(--app-bg); color: var(--text-main);">
    <div id="root"></div>
  </body>
</html>
